# Preserve the protected `Build & Test` identity and the existing trusted-base
# changed-range secret scan. The separate whole-tree scan is mandatory on both
# full and focused routes; the non-required shadow compares every focused
# documentation result with the complete same-head suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      route: ${{ steps.scope.outputs.route }}
    steps:
      - name: Check out exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python for trusted scanner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"

      # This is the pre-existing security boundary: run stdlib-only base code
      # before any candidate dependency install. It scans every blob introduced
      # anywhere in the PR/push range, including content later removed.
      - name: Secret scan every introduced blob from trusted base
        timeout-minutes: 10
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            pull_request) BASE="origin/${BASE_REF}" ;;
            push) BASE="${EVENT_BEFORE}" ;;
            *) echo "secret-scan: unknown event ${EVENT_NAME} — fail closed"; exit 1 ;;
          esac
          if git cat-file -e "${BASE}:compile/secret_scan.py" 2>/dev/null; then
            git show "${BASE}:compile/secret_scan.py" > "${RUNNER_TEMP}/secret_scan_trusted.py"
          else
            # Bootstrap only: the trusted base predates the scanner.
            cp compile/secret_scan.py "${RUNNER_TEMP}/secret_scan_trusted.py"
          fi
          python3 "${RUNNER_TEMP}/secret_scan_trusted.py" --changed-against "$BASE"

      - name: Record required-job start
        run: echo "VERIFY_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Classify from trusted base
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          route=full
          reason=push_full
          planned=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            adapter="$RUNNER_TEMP/verification_adapter.py"
            dispatcher="$RUNNER_TEMP/run_verification_bundles.py"
            plan="$RUNNER_TEMP/proportional-verification-plan.json"
            trusted="$RUNNER_TEMP/proportional-verification-initial"
            extract_regular() {
              local path="$1" target="$2" entry mode type object found
              entry=$(git ls-tree "$BASE_SHA" -- "$path") || return 1
              IFS=$' \t' read -r mode type object found <<< "$entry"
              [[ "$mode" == 100644 && "$type" == blob && "$found" == "$path" ]] || return 1
              git cat-file blob "$object" > "$target"
              chmod 644 "$target"
            }
            if ! extract_regular tools/verification_adapter.py "$adapter" ||
              ! extract_regular tools/run_verification_bundles.py "$dispatcher"; then
              reason=trusted_base_adapter_unavailable
            elif python3 "$adapter" \
              --repo . \
              --event pull_request \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --trusted-root "$trusted" \
              --output "$plan"; then
              planned=true
              if selection=$(python3 - "$plan" <<'PY'
          import json
          import re
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          route = value.get("route")
          reason = value.get("reason")
          if route not in {"focused", "full"}:
              raise SystemExit("invalid route")
          if not isinstance(reason, str) or re.fullmatch(r"[a-z0-9_-]+", reason) is None:
              raise SystemExit("invalid reason")
          print(f"{route}\t{reason}")
          PY
              ); then
                IFS=$'\t' read -r candidate candidate_reason <<< "$selection"
                reason="$candidate_reason"
                if [[ "$candidate" == focused ]]; then
                  route=focused
                fi
              else
                reason=invalid_selector_output
              fi
            else
              reason=adapter_failed
            fi
          fi
          printf 'route=%s\nreason=%s\nplanned=%s\n' "$route" "$reason" "$planned" >> "$GITHUB_OUTPUT"

      - name: Upload plan attestation
        if: steps.scope.outputs.planned == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: proportional-verification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proportional-verification-plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Whole-tree credential scan for full route
        if: steps.scope.outputs.route == 'full'
        run: python3 compile/secret_scan.py --tree HEAD --max-seconds 300

      - name: Set up Node for full verification
        if: steps.scope.outputs.route == 'full'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: Cache exact-head Python downloads for full verification
        if: steps.scope.outputs.route == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: >-
            pvq176-wiki-${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{
            github.event.pull_request.head.sha || github.sha }}-${{ github.job }}

      - name: Cache exact-head Node downloads for full verification
        if: steps.scope.outputs.route == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.npm
          key: >-
            pvq176-wiki-${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}-${{
            github.event.pull_request.head.sha || github.sha }}-${{ github.job }}

      - name: Install Python dependencies for full verification
        if: steps.scope.outputs.route == 'full'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies for full verification
        if: steps.scope.outputs.route == 'full'
        run: npm ci

      - name: Run proportional controls in full verification
        if: steps.scope.outputs.route == 'full'
        run: |
          python3 tools/check_repository_contracts.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_repository_contracts.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_verification_adapter.py' -v

      - name: Stable SemVer and release notes
        if: steps.scope.outputs.route == 'full'
        run: |
          python3 compile/release.py check
          python3 compile/test_release.py

      - name: Stats unit tests
        if: steps.scope.outputs.route == 'full'
        run: python3 compile/test_stats.py

      - name: Build static wiki
        if: steps.scope.outputs.route == 'full'
        run: npm run build

      - name: Python unit tests
        if: steps.scope.outputs.route == 'full'
        run: npm run test:py

      - name: Terminology snapshot boundaries and asset syntax
        if: steps.scope.outputs.route == 'full'
        run: npm run test:terminology

      - name: Deployment migration and recovery tests
        if: steps.scope.outputs.route == 'full'
        run: python3 compile/test_deployment.py

      - name: Arc asset syntax check
        if: steps.scope.outputs.route == 'full'
        run: npm run test:js

      - name: Arc unit tests
        if: steps.scope.outputs.route == 'full'
        run: npm run test:unit

      - name: Arc DOM smoke test
        id: required_full
        if: steps.scope.outputs.route == 'full'
        run: npm run test:dom

      - name: Confirm and run fixed focused bundles
        if: steps.scope.outputs.route == 'focused'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          adapter="$RUNNER_TEMP/verification_adapter.py"
          confirmation="$RUNNER_TEMP/proportional-verification-confirmation.json"
          trusted_confirmation="$RUNNER_TEMP/proportional-verification-confirmation-engine"
          python3 "$adapter" \
            --repo . \
            --event pull_request \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --trusted-root "$trusted_confirmation" \
            --output "$confirmation"
          python3 "$RUNNER_TEMP/run_verification_bundles.py" \
            --repo-root . \
            --plan "$RUNNER_TEMP/proportional-verification-plan.json" \
            --confirmation "$confirmation" \
            --engine-root "$RUNNER_TEMP/proportional-verification-initial" \
            --timings "$RUNNER_TEMP/proportional-verification-execution.json"

      - name: Record required full-route evidence
        if: always() && steps.scope.outputs.route == 'full'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME: ${{ steps.required_full.outcome }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          record = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "head": os.environ["HEAD_SHA"],
              "route": "full-required",
              "reason": os.environ.get("REASON") or "unclassified",
              "outcome": os.environ.get("OUTCOME") or "unknown",
              "wall_seconds_after_scan": max(0, int(time.time()) - int(os.environ["VERIFY_JOB_STARTED"])),
          }
          Path(os.environ["RUNNER_TEMP"], "proportional-verification-full-required.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload required-route evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: proportional-verification-required-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proportional-verification-confirmation.json
            ${{ runner.temp }}/proportional-verification-execution.json
            ${{ runner.temp }}/proportional-verification-full-required.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record timing summary
        if: always()
        env:
          ROUTE: ${{ steps.scope.outputs.route }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          total=$(( $(date +%s) - VERIFY_JOB_STARTED ))
          printf '%s\n' \
            '### Proportional verification' \
            '' \
            "- Route: $ROUTE" \
            "- Reason: $REASON" \
            "- Job wall time after trusted changed-range scan: $total seconds" \
            >> "$GITHUB_STEP_SUMMARY"

  full-shadow:
    name: full-shadow
    needs: verify
    if: always() && github.event_name == 'pull_request' && needs.verify.outputs.route == 'focused'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"

      - name: Recheck changed range and whole tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:compile/secret_scan.py" > "$RUNNER_TEMP/secret_scan_trusted.py"
          python3 "$RUNNER_TEMP/secret_scan_trusted.py" --changed-against "$BASE_SHA"
          python3 compile/secret_scan.py --tree HEAD --max-seconds 300

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: Cache exact-head Python downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: >-
            pvq176-wiki-${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-${{
            github.event.pull_request.head.sha }}-${{ github.job }}

      - name: Cache exact-head Node downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.npm
          key: >-
            pvq176-wiki-${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}-${{
            github.event.pull_request.head.sha }}-${{ github.job }}

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci

      - name: Run and measure complete shadow verification
        id: shadow
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          started=$(date +%s)
          status=0
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            status=2
          else
            set +e
            python3 tools/check_repository_contracts.py &&
              PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_repository_contracts.py' -v &&
              PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_verification_adapter.py' -v &&
              python3 compile/release.py check &&
              python3 compile/test_release.py &&
              python3 compile/test_stats.py &&
              npm run build &&
              npm run test:py &&
              npm run test:terminology &&
              python3 compile/test_deployment.py &&
              npm run test:js &&
              npm run test:unit &&
              npm run test:dom
            status=$?
            set -e
          fi
          finished=$(date +%s)
          printf 'status=%s\nduration=%s\n' "$status" "$((finished - started))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record full-shadow evidence
        if: always()
        env:
          DURATION: ${{ steps.shadow.outputs.duration }}
          STATUS: ${{ steps.shadow.outputs.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "head": os.environ["HEAD_SHA"],
              "route": "full-shadow",
              "exit_status": int(os.environ.get("STATUS") or -1),
              "wall_seconds": int(os.environ.get("DURATION") or 0),
          }
          Path(os.environ["RUNNER_TEMP"], "proportional-verification-full-shadow.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload full-shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: proportional-verification-full-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proportional-verification-full-shadow.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"
      - name: Publish checked version with committed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 compile/release.py publish --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
